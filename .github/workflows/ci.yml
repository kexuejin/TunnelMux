name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Shell script syntax check
        run: bash -n scripts/*.sh

      - name: GUI JavaScript checks
        run: |
          node --check crates/tunnelmux-gui/ui/app.js
          node --test \
            crates/tunnelmux-gui/ui/app.test.mjs \
            scripts/verify-easy-path.test.mjs \
            scripts/package-local-release-archive.test.mjs \
            scripts/verify-release-manifest.test.mjs
          node scripts/gui-e2e.mjs

      - name: Test
        run: cargo test --workspace --locked

  core-platform:
    name: Core checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Test core workspace
        run: cargo test --locked -p tunnelmux-core -p tunnelmux-control-client -p tunnelmux-cli -p tunnelmuxd

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: RustSec audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
